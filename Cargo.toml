[workspace]
resolver = "3"
members = ["audio/resample", "formats/gbs", "formats/gym", "formats/hes", "formats/nsf", "formats/psf", "formats/spc", "formats/vgm", "cores/gba/rust", "cores/gb/rust", "cores/nes/rust", "cores/snes/rust", "cores/genesis/rust", "cores/pce/rust", "ffi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
oscilla-gbs = { path = "formats/gbs" }
oscilla-gym = { path = "formats/gym" }
oscilla-hes = { path = "formats/hes" }
oscilla-nsf = { path = "formats/nsf" }
oscilla-psf = { path = "formats/psf" }
oscilla-spc = { path = "formats/spc" }
oscilla-vgm = { path = "formats/vgm" }
oscilla-resample = { path = "audio/resample" }
oscilla-gba = { path = "cores/gba/rust" }
oscilla-gb = { path = "cores/gb/rust" }
oscilla-nes = { path = "cores/nes/rust" }
oscilla-snes = { path = "cores/snes/rust" }
oscilla-genesis = { path = "cores/genesis/rust" }
oscilla-pce = { path = "cores/pce/rust" }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
