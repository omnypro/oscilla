[package]
name = "oscilla-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]

[features]
default = ["gba", "gb"]
gba = ["dep:oscilla-gba"]
gb = ["dep:oscilla-gb", "dep:oscilla-gbs"]

[dependencies]
oscilla-gba = { workspace = true, optional = true }
oscilla-gb = { workspace = true, optional = true }
oscilla-gbs = { workspace = true, optional = true }
